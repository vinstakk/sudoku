<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symbol-Vorschau</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { padding: 16px; user-select: auto; }
    h2 { margin: 18px 0 8px; font-size: 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tile { width: 74px; text-align: center; font-size: .62rem; color: var(--muted); background: var(--card); border-radius: 10px; padding: 6px 2px; }
    .tile svg { width: 44px; height: 44px; display: block; margin: 0 auto 3px; }
    .small svg { width: 18px; height: 18px; }
    .small { display: flex; gap: 3px; flex-wrap: wrap; background: var(--card); padding: 6px; border-radius: 8px; margin-top: 6px; width: max-content; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script src="../js/symbols.js"></script>
  <script>
    Symbols.inject();
    const out = document.getElementById('out');
    if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';
    for (const key of Symbols.ORDER) {
      const s = Symbols.SETS[key]; if (!s.items) continue;
      let h = `<h2>${s.label}</h2><div class="row">`;
      s.items.forEach(([n], k) => { h += `<div class="tile"><svg style="color:var(--s${k + 1});--sym-detail:var(--d${k + 1},#fff)"><use href="#sym-${key}-${k + 1}"/></svg>${k + 1}. ${n.replace(/^(der|die|das) /, '')}</div>`; });
      h += '</div><div class="small">' + s.items.map((_, k) => `<svg style="color:var(--s${k + 1});--sym-detail:var(--d${k + 1},#fff)"><use href="#sym-${key}-${k + 1}"/></svg>`).join('') + '</div>';
      out.insertAdjacentHTML('beforeend', h);
    }
  </script>
</body>
</html>
